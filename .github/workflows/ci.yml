name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Package app
        run: ./scripts/build-app.sh
      - name: Package dmg
        run: ./scripts/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Tichit-dmg
          path: build/Tichit.dmg
