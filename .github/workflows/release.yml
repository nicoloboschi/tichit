name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "number=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp version into the bundle
        run: |
          sed -i '' \
            "s|<key>CFBundleShortVersionString</key><string>.*</string>|<key>CFBundleShortVersionString</key><string>${{ steps.version.outputs.number }}</string>|" \
            scripts/build-app.sh

      - name: Build app
        run: ./scripts/build-app.sh

      - name: Package dmg
        run: ./scripts/make-dmg.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            build/Tichit.dmg \
            --title "Tichit ${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --notes "
          ## Install

          Download \`Tichit.dmg\`, open it, drag Tichit to Applications.

          The app is **not code-signed or notarized**, so macOS will refuse the first
          launch. Right-click Tichit in Applications, choose **Open**, then confirm.
          You only need to do this once.
          " || gh release upload "${{ steps.version.outputs.tag }}" build/Tichit.dmg --clobber
